[project]
name = "kessler"
version = "0.1.0"
description = "Orbital breakup forensics from public orbital data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=17",
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.13",
  "sgp4>=2.23",
  "scikit-learn>=1.5",
  "ruptures>=1.1.9",
  "httpx>=0.27",
  "pydantic>=2.8",
  "typer>=0.12",
  "pyyaml>=6",
  "rich>=13",
]

[project.scripts]
kessler = "kessler.cli:app"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]
notebooks = ["matplotlib>=3.9", "jupyter>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kessler"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real network; run manually only"]
addopts = "-m 'not live'"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = false

name: ingest                              # publish.yml's workflow_run matches on this name
on:
  schedule: [{ cron: "23 */6 * * *" }]    # off the top of the hour; <= 4 runs/day
  workflow_dispatch:
concurrency: { group: ingest, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7                       # main (code)
      - uses: actions/checkout@v7
        with: { ref: data, path: warehouse_repo }
      - uses: astral-sh/setup-uv@v10
        with: { enable-cache: true }
      - run: uv sync --frozen
      # The HTTP cache makes re-runs free: always restore the most recent cache, save a new one.
      - uses: actions/cache@v6
        with:
          path: .cache/http
          key: http-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: http-
      - name: Ingest (polite, cached, stops on first CelesTrak error)
        run: uv run kessler ingest --warehouse warehouse_repo/warehouse --cache .cache/http
      - name: Issue reentry forecasts
        run: uv run kessler forecast --warehouse warehouse_repo/warehouse
      - name: Commit new data
        working-directory: warehouse_repo
        run: |
          git config user.name "kessler-bot"
          git config user.email "kessler-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "ingest $(date -u +%FT%TZ)"
          git push
      - name: Keep scheduled workflows alive (GitHub disables them after 60 idle days)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "kessler-bot"
            git config user.email "kessler-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: scheduled ingest is still running"
            git push
          fi
